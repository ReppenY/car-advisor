[project]
name = "car-advisor"
version = "0.1.0"
description = "Local car-review advisor. LangGraph agent over a persistent Hebrew corpus."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "chromadb>=1.1.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "trafilatura>=2.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
car-advisor = "car_advisor.chat:main"
car-advisor-web = "car_advisor.api:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
